name: cron 探针（临时，验证本仓 schedule 是否真的会触发）

# 目的：deploy.yml 的 `7,37` 定时在 12:07/12:37/13:07 三拍全部没出现（2026-11-16），
# 需要区分是「GitHub 定时器在高负载下整体延后/丢拍」还是「本仓 schedule 未注册」。
# 用一个每 5 分钟的最小 workflow 做对照：它会触发 → 定时机制正常，deploy 那三拍属
# 延迟/丢拍；它也不触发 → 问题在本仓的 schedule 注册，须另找原因。
# 验证完成后删除本文件。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          date -u
          echo "schedule 事件已触发（event=${{ github.event_name }}）"
