name: 🔗 无电子书-自动拉取-部署

on:
  workflow_dispatch: 
# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
# 如果设置为 true 会造成提交成功但编译被取消且无法再次编译直至下一次提交

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changes_made: ${{ steps.check_changes.outputs.changes_made }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
   
      - name: 更新子模块到最新提交
        run: |
          git submodule update --init --recursive --remote
      - name: 配置 git
        run: |
          git config --global user.name "ykla"
          git config --global user.email "yklaxds@gmail.com"

      - name: 检查是否有更改
        id: check_changes
        run: |
          echo "changes_made=$(git diff --quiet || echo true)" >> $GITHUB_ENV && echo "changes_made=$(git diff --quiet || echo true)" >> $GITHUB_OUTPUT
          # 同时设置设置环境变量和输出变量，两个不一样
          # 创建或更新环境变量的步骤无法访问新值，但在作业中的所有后续步骤均可访问。<https://docs.github.com/zh/enterprise-cloud@latest/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable>
      - name: 提交更改
        if: ${{ env.changes_made== 'true' }}
        id: commit
        run: |
          echo "-----------------------------------------"
          printf '%s\n' "$changes_made"
          echo "-----------------------------------------"
          git add .
          git commit -m "sync SEP-CN 子模块指针"
          git push
          git config --global --unset user.name
          git config --global --unset user.email
    

          
  nothing:
    needs: sync
    runs-on: ubuntu-latest
    if: ${{ needs.sync.outputs.changes_made != 'true' }}
    steps:
      - name: 显示状态
        run: |
          echo "无事可做"
          exit 0
   

  build:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ needs.sync.outputs.changes_made == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [ad, ek, lp, qz]
    steps:
      - name: 检出代码，使用本地的子模块版本而非上游版本
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: 设置 bun 环境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成首页（仅 ad 片：根级页面都在这一片）
        if: matrix.shard == 'ad'
        run: cp -a docs/README.md docs/index.md

      - name: 增加 swap 32G（构建峰值内存超出 runner 物理内存，2026-11-16 用户裁定）
        run: |
          df -h / | tail -1
          SWAP=/swapfile2   # /swapfile 是 runner 预置的 3 GiB swap，占用中（Text file busy）
          sudo rm -f "$SWAP"
          if sudo fallocate -l 32G "$SWAP"; then
            echo "swap 32G via fallocate"
          else
            echo "fallocate 32G 失败，降级 dd 12G"
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=12288 status=progress
          fi
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -hg

      - name: 安装依赖
        run: bun install

      - name: 构建分片 ${{ matrix.shard }}
        run: |
          SEP_SHARD=${{ matrix.shard }} bun --bun run docs:build
          du -sh docs/.vitepress/dist-${{ matrix.shard }}

      - name: 上传分片产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.shard }}
          path: docs/.vitepress/dist-${{ matrix.shard }}
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: 设置 bun 环境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 安装依赖
        run: bun install

      - name: 下载分片产物
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: docs/.vitepress/shards

      - name: 合并分片 + pagefind
        run: |
          bun docs/.vitepress/merge-shards.mjs \
            docs/.vitepress/shards/dist-ad \
            docs/.vitepress/shards/dist-ek \
            docs/.vitepress/shards/dist-lp \
            docs/.vitepress/shards/dist-qz

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: 显示使用情况
        run: |
          du -h ${{ runner.temp }}/artifact.tar
          du -sh docs/.vitepress/dist
          date

  deploy:
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ success() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
