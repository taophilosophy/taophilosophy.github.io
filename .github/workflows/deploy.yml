name: 🔗 站点部署（分片矩阵；拉取子模块后按需构建）

# 原 push_deploy.yml（手动部署当前指针）与 sync_deploy.yml（先拉 docs 到上游最新再部署）
# 的 build/merge/deploy 三段完全重复（2026-11-16 合并，ADR-0061）：构建链只有一份。
#
# 三种入口（2026-11-17 用户裁定：恢复 71e200e6 双通道语义＋加定时）：
#   * schedule（7,37，每 30 分钟）—— 定时拉取：sync 作业拉 docs 子模块到 SEP-CN
#     最新，指针有变则提交并构建部署；无变更整条链只跑一个 sync 作业（约 40 秒）收工
#   * workflow_dispatch（sync_docs=true，默认）—— 手动拉取：与定时同一条同步-部署链
#     ≙ 71e200e6 的 sync_deploy.yml「自动拉取-部署」（内容更新通道）
#   * workflow_dispatch（sync_docs=false）—— 手动部署当前指针：跳过 sync，不拉取、
#     不动指针，把壳仓当前钉住的版本原样重建成站
#     ≙ 71e200e6 的 push_deploy.yml「手动部署 GitPage」（配置重放通道）
# 双通道并存的理由：更新内容（跟上游）与重放出站（用现状）是两种意图，合并起来
# 会出现「只想改主题却被拉进上游变更」或「想更新却忘了拉」的错位。
# cron 为尽力而为（本仓实测 3.5h 零触发，ADR-0064 探针终审）；60 天无活动自动停用。
#
# 构建 = 4 个分片并行（SEP_SHARD=ad|ek|lp|qz，见 docs/.vitepress/config.mts）→
# 各片照常跑死链检查（跨片链接按全站页面集豁免，真死链仍失败）。
# merge 作业合并 dist、并集 hashmap.json、拼 sitemap、跑一次 pagefind → deploy。

on:
  workflow_dispatch:
    inputs:
      sync_docs:
        description: 'true＝手动拉取（拉子模块到上游最新，有变才构建）；false＝手动部署当前指针（不拉取、不动指针）'
        type: boolean
        default: true
  schedule:
    # 每 30 分钟定时拉取（UTC）；指针未变时不构建，成本只有一个检出作业。
    # 错开整点/半点：GitHub 的定时器按缓存过期批量扫，:00/:30 是全网最挤的时刻，
    # 实测 11:30 这一拍延迟 20 分钟仍未触发；改 :07/:37 提高准时率。
    - cron: "7,37 * * * *"

# 部署到 GitHub Pages 需要 pages/id-token；sync 模式还要提交子模块指针
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只允许一次 Pages 部署（分片构建 + 合并后更需要串行）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    # 定时与手动拉取走同步档；「手动部署当前指针」档（sync_docs=false）整段跳过
    if: ${{ inputs.sync_docs || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 更新子模块到最新提交
        run: git submodule update --init --recursive --remote

      - name: 配置 git
        run: |
          git config --global user.name "ykla"
          git config --global user.email "yklaxds@gmail.com"

      - name: 检查是否有更改（只认 docs 子模块指针）
        id: check
        run: |
          if git status --porcelain -- docs | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- docs
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs 指针未变，跳过构建（无需部署）"
          fi

      - name: 提交子模块指针
        if: steps.check.outputs.changed == 'true'
        run: |
          git add docs
          git commit -m "sync SEP-CN 子模块指针"
          git push
          git config --global --unset user.name
          git config --global --unset user.email

  build:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 拉取档：指针确有变化才构建。always() 不可省：「手动部署当前指针」档会跳过
    # sync，缺 always() 的 job 级 if 被隐式 success() 短路，矩阵与 merge/deploy
    # 全部 skipped（2026-11-16 实测四个 job 全 skip、无任何 step 执行）。
    if: >-
      ${{
        always() && (
          needs.sync.result == 'skipped'
          || (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true')
        )
      }}
    strategy:
      fail-fast: false
      matrix:
        shard: [ad, ek, lp, qz]
    steps:
      - name: Show the timezone
        run: |
          date
          uname -r
          free -hg

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 取分支头（含 sync 刚推送的新指针）；71e200e6 原版即 ref: main
          ref: main
          fetch-depth: 0 # 页脚 lastUpdated 需要（git-stamps）
          submodules: 'true'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成首页（仅 ad 片：根级页面都在这一片）
        if: matrix.shard == 'ad'
        run: cp -a docs/README.md docs/index.md

      - name: 增加 swap 32G（构建峰值内存超出 runner 物理内存，2026-11-16 用户裁定）
        run: |
          df -h / | tail -1
          SWAP=/swapfile2   # /swapfile 是 runner 预置的 3 GiB swap，占用中（Text file busy）
          sudo rm -f "$SWAP"
          if sudo fallocate -l 32G "$SWAP"; then
            echo "swap 32G via fallocate"
          else
            echo "fallocate 32G 失败，降级 dd 12G"
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=12288 status=progress
          fi
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -hg

      - name: Install dependencies
        run: bun install

      - name: Build shard ${{ matrix.shard }}
        run: |
          SEP_SHARD=${{ matrix.shard }} bun run docs:build
          du -sh docs/.vitepress/dist-${{ matrix.shard }}

      - name: Upload shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.shard }}
          path: docs/.vitepress/dist-${{ matrix.shard }}
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 同 build：依赖链上出现过被 if 跳过的 job 时，缺 always() 的 job 级 if 会被
    # 隐式 success() 短路（实测四个分片全绿，merge/deploy 仍 skipped）
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: 'true'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: docs/.vitepress/shards

      - name: 合并分片 + pagefind
        run: |
          bun docs/.vitepress/merge-shards.mjs \
            docs/.vitepress/shards/dist-ad \
            docs/.vitepress/shards/dist-ek \
            docs/.vitepress/shards/dist-lp \
            docs/.vitepress/shards/dist-qz

      - name: upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Show Usage
        run: |
          du -h ${{ runner.temp }}/artifact.tar
          echo "-----------------------------"
          du -sh docs/.vitepress/dist
          echo "-----------------------------"
          date

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: merge
    runs-on: ubuntu-latest
    name: Deploy
    if: ${{ always() && needs.merge.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
