name: 🔗 站点部署（分片矩阵；可选先拉子模块）

# 原 push_deploy.yml（手动部署当前指针）与 sync_deploy.yml（先拉 docs 到上游最新再部署）
# 的 build/merge/deploy 三段完全重复（2026-11-16 合并，ADR-0061）：本工作流用
# `sync_docs` 开关区分两种入口，构建链只有一份，避免两条链各自漂移。
#
# 三种入口（2026-11-16 补定时，ADR-0064）：
#   * schedule（*/30）——自动同步：拉 docs 到 SEP-CN 最新，指针变了才构建部署；
#     指针未变时整条链只跑一个 sync 作业（约 40 秒）就收工
#   * workflow_dispatch + sync_docs=true —— 手动触发同一条同步-部署链
#   * workflow_dispatch + sync_docs=false —— 只部署当前指针（不回拉子模块）
# 注意：名里“自动拉取”一直指**自动拉子模块**，定时是本次新增；GitHub 的 cron
# 是尽力而为（高峰可延迟数分钟），仓库连续 60 天无活动会被自动停用。
#
# 构建 = 4 个分片并行（SEP_SHARD=ad|ek|lp|qz，见 docs/.vitepress/config.mts）→
# 各片照常跑死链检查（跨片链接按全站页面集豁免，真死链仍失败）。
# merge 作业合并 dist、并集 hashmap.json、拼 sitemap、跑一次 pagefind → deploy。

on:
  workflow_dispatch:
    inputs:
      sync_docs:
        description: '先把 docs 子模块拉到上游最新并提交指针，再构建部署'
        type: boolean
        default: false
  schedule:
    # 每 30 分钟一次自动同步（UTC）；指针未变时不构建，成本只有一个检出作业。
    # 错开整点/半点：GitHub 的定时器按缓存过期批量扫，:00/:30 是全网最挤的时刻，
    # 实测 11:30 这一拍延迟 20 分钟仍未触发；改 :07/:37 提高准时率。
    - cron: "7,37 * * * *"

# 部署到 GitHub Pages 需要 pages/id-token；sync 模式还要提交子模块指针
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只允许一次 Pages 部署（分片构建 + 合并后更需要串行）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    # 定时运行一律走同步档（先拉子模块）；手动档由 sync_docs 决定
    if: ${{ inputs.sync_docs || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 更新子模块到最新提交
        run: git submodule update --init --recursive --remote

      - name: 配置 git
        run: |
          git config --global user.name "ykla"
          git config --global user.email "yklaxds@gmail.com"

      - name: 检查是否有更改（只认 docs 子模块指针）
        id: check
        run: |
          if git status --porcelain -- docs | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- docs
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs 指针未变，跳过构建（无需部署）"
          fi

      - name: 提交子模块指针
        if: steps.check.outputs.changed == 'true'
        run: |
          git add docs
          git commit -m "sync SEP-CN 子模块指针"
          git push
          git config --global --unset user.name
          git config --global --unset user.email

  build:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 手动模式（不需要 sync）照旧构建；同步模式只在指针确有变化时构建。
    # always() 不可省：sync 被自身 if 跳过时，缺 always() 的 job 级 if 仍会被
    # 隐式的 success() 短路，矩阵与 merge/deploy 全部 skipped（2026-11-16 实测：
    # sync_docs=false 连续两次 dispatch，四个 job 全 skip、无任何 step 执行）。
    if: >-
      ${{
        always() && (
          needs.sync.result == 'skipped'
          || (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true')
        )
      }}
    strategy:
      fail-fast: false
      matrix:
        shard: [ad, ek, lp, qz]
    steps:
      - name: Show the timezone
        run: |
          date
          uname -r
          free -hg

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 同步模式取刚推送的 main（含新指针）；手动模式取本次派发的分支
          ref: ${{ inputs.sync_docs && 'main' || github.ref }}
          fetch-depth: 0 # 页脚 lastUpdated 需要（git-stamps）
          submodules: 'true'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成首页（仅 ad 片：根级页面都在这一片）
        if: matrix.shard == 'ad'
        run: cp -a docs/README.md docs/index.md

      - name: 增加 swap 32G（构建峰值内存超出 runner 物理内存，2026-11-16 用户裁定）
        run: |
          df -h / | tail -1
          SWAP=/swapfile2   # /swapfile 是 runner 预置的 3 GiB swap，占用中（Text file busy）
          sudo rm -f "$SWAP"
          if sudo fallocate -l 32G "$SWAP"; then
            echo "swap 32G via fallocate"
          else
            echo "fallocate 32G 失败，降级 dd 12G"
            sudo dd if=/dev/zero of="$SWAP" bs=1M count=12288 status=progress
          fi
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -hg

      - name: Install dependencies
        run: bun install

      - name: Build shard ${{ matrix.shard }}
        run: |
          SEP_SHARD=${{ matrix.shard }} bun run docs:build
          du -sh docs/.vitepress/dist-${{ matrix.shard }}

      - name: Upload shard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.shard }}
          path: docs/.vitepress/dist-${{ matrix.shard }}
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 同 build：依赖链上出现过被 if 跳过的 job 时，缺 always() 的 job 级 if 会被
    # 隐式 success() 短路（实测四个分片全绿，merge/deploy 仍 skipped）
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sync_docs && 'main' || github.ref }}
          fetch-depth: 0
          submodules: 'true'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install

      - name: Download shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: docs/.vitepress/shards

      - name: 合并分片 + pagefind
        run: |
          bun docs/.vitepress/merge-shards.mjs \
            docs/.vitepress/shards/dist-ad \
            docs/.vitepress/shards/dist-ek \
            docs/.vitepress/shards/dist-lp \
            docs/.vitepress/shards/dist-qz

      - name: upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Show Usage
        run: |
          du -h ${{ runner.temp }}/artifact.tar
          echo "-----------------------------"
          du -sh docs/.vitepress/dist
          echo "-----------------------------"
          date

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: merge
    runs-on: ubuntu-latest
    name: Deploy
    if: ${{ always() && needs.merge.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
